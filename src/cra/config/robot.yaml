robot:
  name: cognitive_robotic_arm
  mode: simulation # simulation / robot

  model:
    path: models/robot_model/cognitive_robotics_arm.xml

  frames:
    base: base_link
    end_effector: end_effector

  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5

workspace:
  num_samples: 50000
  random_seed: 42

gng:
  max_nodes: 1000
  epochs: 20
  epsilon_b: 0.05
  epsilon_n: 0.006
  max_edge_age: 50
  lambda: 100
  error_decay: 0.995

planning:
  obstacle_safety_margin: 0.005

  path_processing:
    remove_duplicate_points: true

  joint_graph:
    max_candidates: 4
    nearest_pool: 64
    max_joint_delta: 0.8

kinematics:
  inverse:
    max_iterations: 5000
    tolerance: 0.0001
    damping: 0.01
    step_size: 0.5
    max_joint_step: 0.1

  jacobian:
    damping: 0.01

motion:
  control_mode: joint_trajectory # cartesian / joint_trajectory
  target_source: simulation_marker
  feedback_timeout: 0.2

  cartesian:
    speed: 0.1
    gain: 2.0
    tolerance: 0.01

  joint:
    speed: 0.5
    gain: 2.0
    tolerance: 0.02
    start_tolerance: 0.10
    max_segment_delta: 0.6
  
  monitoring:
    goal_timeout: 10.0
    stall_timeout: 2.0
    tracking_error_limit: 0.2
    tracking_error_timeout: 0.5

trajectory:
  enabled: true
  distance_step: 0.01
  curve: linear # linear / ease_in / ease_out / smooth_step / smoother_step
  replan_threshold: 0.005

simulation:
  obstacles:
    enabled: true
    mocap_body_prefix: obstacle_
    pause_on_change: true
    replan_interval: 0.25