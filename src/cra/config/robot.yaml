robot:
  name: cognitive_robotic_arm
  mode: simulation # simulation / robot

  model:
    path: models/robot_model/cognitive_robotics_arm.xml

  frames:
    base: base_link
    end_effector: end_effector

  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5

rviz:
  enabled: true

vision:
  tracker_enqueue_wait_ms: 5 # -1: blocking; 5: bounded tracker admission wait

logging:
  enabled: true
  latest_file: /home/lvinz/living-lab/cra_ws/logs/cra_latest.log
  max_size_mb: 20

workspace:
  path: ~/living-lab/cra_ws/src/planning/data/raw_workspace.npz
  num_samples: 50000
  random_seed: 42

gng:
  graph_path: ~/living-lab/cra_ws/src/planning/data/workspace_graph.npz
  max_nodes: 1000
  epochs: 20
  epsilon_b: 0.05
  epsilon_n: 0.006
  max_edge_age: 50
  lambda: 100
  error_decay: 0.995

planning:
  planner_mode: rrt # gng / rrt / combined; restart launch after changing.
  obstacle_safety_margin: 0.005

  astar:
    mode: blocking # blocking / incremental; restart launch after changing.
    slice_budget_ms: 10.0 # Incremental only; one collision query can overrun this soft budget.
    slice_period_ms: 10.0 # Yield to ROS callbacks between search slices.
    max_operations_per_slice: 2048

  visualization:
    workspace_graph_rate_hz: 2.0 # Display only; collision checks keep their normal scheduling.

  human_avoidance:
    enabled: true
    data_timeout: 2.0 # User-approved simulation trial; capture age is still checked.
    future_tolerance: 0.1
    safety_margin: 0.05 # User-approved 5 cm human margin for the simulation trial.

  path_processing:
    remove_duplicate_points: true

  collision_checks:
    human_report_cache_size: 256 # Exact geometry reuse within the current snapshot.

  goal_selection:
    retain_valid_goal: true
    clearance_candidates: 4 # Rank only a bounded pool of valid graph goals.
    preferred_clearance: 0.07 # Soft preference; the mandatory margin remains 0.05 m.
    ik_fallback:
      enabled: true # Simulation only; used only when no valid graph goal is available.
      max_seeds: 6
      max_iterations: 80
      time_budget_ms: 100.0
      retry_interval: 1.0
      position_tolerance: 0.001

  rrt:
    # Worker settings for rrt/combined; planner_mode above selects the algorithm.
    fallback_budget: 1.5 # Admission through latest-scene validation, including worker startup.
    visualization_enabled: true # Disable to skip visual trace recording.
    visualization:
      mode: live # live / playback; restart launch after changing.
      publish_rate_hz: 10.0
      playback_duration_s: 2.0 # Playback only; never delays Motion.
      show_rejected: false
      max_nodes_per_tree: 256
      max_events: 512
      history_duration_s: 3.0 # Visual history, not a safety certificate.
    search_budget: 0.5
    selection_budget: 2.0 # Clearance selection applies in shadow mode only.
    preference_search_budget: 0.8
    validation_budget: 0.5
    preferred_clearance: 0.07
    retry_interval: 3.0

  execution_progress:
    enabled: true
    corridor_tolerance: 0.04 # Joint-space passage evidence, not a collision margin.
    confirmation_samples: 2
    handoff_fraction: 0.9
    max_feedback_step: 0.05

  joint_graph:
    max_candidates: 4
    nearest_pool: 64
    max_joint_delta: 0.8

kinematics:
  inverse:
    max_iterations: 5000
    tolerance: 0.0001
    damping: 0.01
    step_size: 0.5
    max_joint_step: 0.1

  jacobian:
    damping: 0.01

motion:
  control_mode: joint_trajectory # cartesian / joint_trajectory
  target_source: simulation_marker
  feedback_timeout: 0.2

  cartesian:
    speed: 0.1
    gain: 2.0
    tolerance: 0.01

  joint:
    speed: 0.5
    gain: 2.0
    tolerance: 0.02
    start_tolerance: 0.10
    max_segment_delta: 0.6
  
  monitoring:
    goal_timeout: 10.0
    stall_timeout: 2.0
    tracking_error_limit: 0.2
    tracking_error_timeout: 0.5

trajectory:
  enabled: true
  distance_step: 0.01
  curve: linear # linear / ease_in / ease_out / smooth_step / smoother_step
  replan_threshold: 0.005

simulation:
  target_gui:
    enabled: true # Start CRA Target Control together with Simulation

  obstacles:
    enabled: true
    mocap_body_prefix: obstacle_
    pause_on_change: true
    replan_interval: 0.25
